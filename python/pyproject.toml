[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algovoi-rfc9421-signer"
version = "0.1.0"
description = "AlgoVoi RFC 9421 HTTP Message Signatures + RFC 9530 Content-Digest signer (Ed25519)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AlgoVoi", email = "chopmob@gmail.com" }]
keywords = ["rfc9421", "rfc9530", "http-signatures", "ed25519", "agentic-payments", "x402"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = ["pynacl>=1.5.0"]

[project.urls]
Homepage = "https://github.com/chopmob-cloud/algovoi-rfc9421-signer"
Repository = "https://github.com/chopmob-cloud/algovoi-rfc9421-signer"

[tool.hatch.build.targets.wheel]
packages = ["algovoi_rfc9421_signer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
